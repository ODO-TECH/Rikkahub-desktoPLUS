# 全面审查 8-12:Rust/Tauri 侧此前零 CI,lib.rs 坏改动要到本地 tauri build 才暴露。
# 仅在 src-tauri 变更时触发,cargo check 作最低门禁(完整 tauri build 仍在本地/发布流程)。
name: Rust

on:
  push:
    branches: [main]
    # 工作流文件自身也在触发面里:改工作流(如桩步骤)能立即自测,
    # 否则要等下一次 src-tauri 变更才暴露问题。
    paths: ['web-ui/src-tauri/**', '.github/workflows/rust-check.yml']
  pull_request:
    branches: [main]
    paths: ['web-ui/src-tauri/**', '.github/workflows/rust-check.yml']

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-ui/src-tauri

      # tauri-build 的 build.rs 会校验 externalBin sidecar 与 frontendDist 存在性,
      # cargo check 不需要真产物,放空壳即可。
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p web-ui/build/client
          # binaries/ 整目录 gitignore(真 sidecar exe 不入库),全新 checkout 里不存在,
          # touch 不会自建父目录——CI 首跑实证(2026-07)。
          mkdir -p web-ui/src-tauri/binaries
          touch web-ui/src-tauri/binaries/rikkahub-server-x86_64-unknown-linux-gnu
          chmod +x web-ui/src-tauri/binaries/rikkahub-server-x86_64-unknown-linux-gnu

      - name: cargo check
        working-directory: web-ui/src-tauri
        run: cargo check --locked
